<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Example SMART App</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
        <style>
            #patient, #encounter, #communication {
                font-family: Monaco, monospace;
                white-space: pre;
                font-size: 13px;
                height: 30vh;
                overflow: scroll;
                border: 1px solid #CCC;
            }
            table {
                font-family: arial, sans-serif;
                border-collapse: collapse;
                width: 100%;
            }
            td, th {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 8px;
            }
            tr:nth-child(even) {
                background-color: #dddddd;
            }
        </style>
    </head>
    <body>
        <h4>Current Patient</h4>
        <div id="patient">
        <table>
          <tr>
            <th>First Name:</th>
            <td id='fname'></td>
          </tr>
          <tr>
            <th>Last Name:</th>
            <td id='lname'></td>
          </tr>
          <tr>
            <th>Gender:</th>
            <td id='gender'></td>
          </tr>
          <tr>
            <th>Date of Birth:</th>
            <td id='birthdate'></td>
          </tr>
          <tr>
            <th>Preferred Language:</th>
            <td id='language'></td>
          </tr>
        </table>
        <br/>
        </div>
        <h4>Encounter</h4>
        <div id="encounter">Loading...</div>
        <h4>Communications</h4>
        <div id="communication">Loading...</div>
        <script type="text/javascript">
            FHIR.oauth2.ready().then(function(client) {
                
                // Render the current patient (or any error)
                client.patient.read().then(
                    function(pt) {
                        fname = pt.name[0].given;
                        lname = pt.name[0].family;
                        gender = pt.gender;
                        birthdate = pt.birthDate;
                        language = pt.communication[0].language.text;
                        document.getElementById("fname").innerText = fname;
                        document.getElementById("lname").innerText = lname;
                        document.getElementById("gender").innerText = gender;
                        document.getElementById("birthdate").innerText = birthdate;
                        document.getElementById("language").innerText = language;
                    },
                    function(error) {
                        document.getElementById("patient").innerText = error.stack;
                    }
                );
                
                // Get Encounter for the selected patient
                client.request("/Encounter?patient=" + client.patient.id, {
                    resolveReferences: [ "Encounter" ],
                    graph: true
                })
                
                // Reject if no Encounters are found
                .then(function(data) {
                    if (!data.entry || !data.entry.length) {
                        throw new Error("No encounters found for the selected patient");
                    }
                    return data.entry;
                })
                

                // Render the current patient's encounters (or any error)
                .then(
                    function(encounter) {
                        document.getElementById("encounter").innerHTML = buildHtmlTable(encounter);
                    },
                    function(error) {
                        document.getElementById("encounter").innerText = error.stack;
                    }
                );
                // Get All Communications to start
                client.request("/Communication?patient=" + client.patient.id, {
                  resolveReferences: [ "Communication" ],
                  graph: true
                })

                // Reject if no Communications are found
                .then(function(data) {
                  if (!data.entry || !data.entry.length) {
                    throw new Error("No communications found");
                  }
                  return data.entry;
                })

                // Render all Communications
                .then(
                  function(communication) {
                    document.getElementById("communication").innerText = JSON.stringify(communication, null, 4);
                  },
                  function(error) {
                    document.getElementById("communication").innerText = error.stack;
                  }
                );
            }).catch(console.error);
            function buildHtmlTable(encounter) {
              var section = "<table><tr><th>Date</th><th>Status</th><th>Summary</th><th>ID</th></tr>";
              for (var i = 0; i < encounter.length; i++) {
                var date = encounter[i].resource.period.start;
                var status = encounter[i].resource.status;
                var summary = encounter[i].resource.type[0].text;
                var id = encounter[i].resource.id;
                var row  = "<tr><td>" + date + "</td><td>" + status + "</td><td>" + summary + "</td><td>" + id + "</td></tr>";

                section = section + row;
              }
              var table = section + "</table>";
              return table; 
            }

        </script>
    </body>
</html>
