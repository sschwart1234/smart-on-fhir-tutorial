<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <title>Example-SMARTer-App</title>
  </head>
  <body>
    <div id='holder' >
      <h2>Simple SMART-App</h2>
      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First name:</th>
          <td id='fname'></td>
        </tr>
        <tr>
          <th>Last name:</th>
          <td id='lname'></td>
        </tr>
        <tr>
          <th>Gender:</th>
          <td id='gender'></td>
        </tr>
        <tr>
          <th>Date of Birth:</th>
          <td id='birthdate'></td>
        </tr>
      </table> 
    </div>
    <!-- FHIR Client JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
      FHIR.oauth.read().then(function(client) {
        client.patient.read().then(handlePatient)
    });
    function handlePatient(patient) {
      var gender = patient.gender;
      fname = patient.name[0].given;
      lname = patient.name[0].family;
      var p = defaultPatient();
      p.birthdate = patient.birthDate;
      p.gender = gender;
      p.fname = fname;
      p.lname = lname;
      document.getElementById('fname').innerHTML=p.fname;
      document.getElementById('lname').innerHTML=p.lname;
      document.getElementById('gender').innerHTML=p.gender;
      document.getElementById('birthdate').innerHTML=p.birthdate;
  }

  function defaultPatient(){
    return {
      fname: {value: ''},
      lname: {value: ''},
      gender: {value: ''},
      birthdate: {value: ''},
    };
  }
    </script>
  </body>
</html>
